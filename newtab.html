<!-- 
  파일 위치: /my-newtab-extension/newtab.html
  파일명: newtab.html
  용도: Chrome New Tab 페이지의 HTML 구조
  기능: 시계, 검색바, 즐겨찾기 링크 UI 제공
  책임: 사용자 인터페이스의 DOM 구조 정의
-->
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="newtab.css">
</head>

<body>
  <!-- 배경 레이어 -->
  <div class="background-layer" id="backgroundLayer"></div>
  <div class="overlay"></div>

  <!-- 즐겨찾기 아이콘 (왼쪽 상단) -->
  <button class="bookmarks-toggle" id="bookmarksToggle" title="빠른이동">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18" />
    </svg>
  </button>

  <!-- 고정된 즐겨찾기 (왼쪽 상단) -->
  <div class="pinned-bookmarks" id="pinnedBookmarks">
    <!-- JavaScript로 동적 생성 -->
  </div>

  <!-- 즐겨찾기 사이드바 -->
  <aside class="bookmarks-sidebar" id="bookmarksSidebar">
    <div class="bookmarks-header">
      <h2>빠른이동</h2>
      <button class="add-bookmark-icon" id="addBookmarkBtn" title="즐겨찾기 추가">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <nav class="bookmarks-list" id="bookmarksList">
      <!-- JavaScript로 동적 생성 -->
    </nav>
  </aside>

  <!-- 이미지 관리 아이콘 (우측 상단) -->
  <button class="images-toggle" id="imagesToggle" title="이미지 관리">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
  </button>

  <!-- 이미지 관리 사이드바 -->
  <aside class="images-sidebar" id="imagesSidebar">
    <div class="images-header">
      <h2>배경 이미지</h2>
      <button class="close-sidebar" id="closeImagesSidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- 이미지 업로드 영역 -->
    <div class="upload-area-compact" id="uploadArea">
      <input type="file" id="imageUpload" accept="image/*" multiple hidden>
      <label for="imageUpload" class="upload-label-compact">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>이미지 업로드</span>
      </label>
    </div>

    <!-- 업로드된 이미지 목록 -->
    <div class="images-grid-sidebar" id="imagesGrid">
      <!-- JavaScript로 동적 생성 -->
    </div>
  </aside>

  <!-- 설정 아이콘 (우측 상단) -->
  <button class="settings-toggle" id="settingsToggle" title="설정">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 1v6m0 6v6"></path>
      <path d="M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24"></path>
      <path d="M1 12h6m6 0h6"></path>
      <path d="M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"></path>
    </svg>
  </button>

  <!-- 설정 모달 -->
  <div class="modal" id="settingsModal">
    <div class="modal-content modal-settings">
      <div class="settings-sidebar">
        <h3>설정</h3>
        <nav class="settings-menu">
          <button class="settings-menu-item active" data-section="image">이미지</button>
          <button class="settings-menu-item" data-section="background">배경</button>
          <button class="settings-menu-item" data-section="overlay">오버레이</button>
        </nav>
      </div>

      <div class="settings-content">
        <!-- 이미지 설정 -->
        <div class="settings-section active" id="settingsImage">
          <div class="settings-group">
            <label class="settings-label">배경 이미지 모드</label>
            <div class="settings-control">
              <div class="toggle-container">
                <input type="checkbox" id="randomImageToggle" class="toggle-input">
                <label for="randomImageToggle" class="toggle-label">
                  <span class="toggle-text" data-on="랜덤" data-off="고정"></span>
                </label>
              </div>
              <p class="setting-description">고정 모드: 한 번 선택된 이미지가 계속 표시됩니다</p>
            </div>
          </div>
        </div>

        <!-- 배경 설정 -->
        <div class="settings-section" id="settingsBackground">
          <div class="settings-group">
            <label class="settings-label">배경 효과</label>
            <div class="settings-control">
              <p class="setting-description">배경 이미지 관련 설정</p>
            </div>
          </div>
        </div>

        <!-- 오버레이 설정 -->
        <div class="settings-section" id="settingsOverlay">
          <div class="settings-group">
            <label class="settings-label">블러 효과</label>
            <div class="settings-control">
              <div class="toggle-container">
                <input type="checkbox" id="blurToggle" class="toggle-input">
                <label for="blurToggle" class="toggle-label">
                  <span class="toggle-text" data-on="ON" data-off="OFF"></span>
                </label>
              </div>
              <p class="setting-description">오버레이 블러 효과를 켜거나 끕니다</p>
            </div>
          </div>

          <div class="settings-group">
            <label class="settings-label">오버레이 투명도</label>
            <div class="settings-control">
              <div class="slider-container">
                <input type="range" id="opacitySlider" class="slider" min="0" max="100" value="50">
                <div class="slider-value"><span id="opacityValue">50</span>%</div>
              </div>
              <p class="setting-description">오버레이 어두운 정도를 조절합니다 (0: 투명, 100: 불투명)</p>
            </div>
          </div>
        </div>

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="closeSettingsBtn">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 날짜 (우측 하단) -->
  <div class="date-display" id="dateDisplay">0000년 0월 0일</div>

  <!-- 메인 컨텐츠 (중앙) -->
  <main class="main-content">
    <!-- 시계 -->
    <div class="clock" id="clock">
      <div class="time" id="time">00:00</div>
    </div>

    <!-- 검색바 -->
    <div class="search-container">
      <form class="search-form" id="searchForm">
        <input type="text" class="search-input" id="searchInput" placeholder="Google 검색 또는 URL 입력" autocomplete="off">
        <button type="submit" class="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- 북마크 추가 모달 -->
  <div class="modal" id="addBookmarkModal">
    <div class="modal-content">
      <h3>즐겨찾기 추가</h3>
      <form id="bookmarkForm">
        <input type="text" id="bookmarkName" placeholder="이름" required>
        <input type="url" id="bookmarkUrl" placeholder="URL (https://...)" required>
        <div class="modal-buttons">
          <button type="submit" class="btn-primary">추가</button>
          <button type="button" class="btn-secondary" id="cancelBtn">취소</button>
        </div>
      </form>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>

</html>
